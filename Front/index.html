<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Enquête policière IA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h2>Enquête Policière IA</h2>

    <label for="suspect">Choisir le suspect :</label>
    <select id="suspect">
      <option value="john">John</option>
      <option value="mary">Mary</option>
      <option value="alice">Alice</option>
      <option value="bruno">Bruno</option>
      <option value="sophie">Sophie</option>
    </select>

    <label for="crime">Choisir le crime :</label>
    <select id="crime">
      <option value="vol">Vol</option>
      <option value="assassinat">Assassinat</option>
      <option value="escroquerie">Escroquerie</option>
    </select>

    <button onclick="verifier()">Vérifier</button>

    <div id="result"></div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
